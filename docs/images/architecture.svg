<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc">
  <title id="title">첫살림 개발 환경 및 시스템 구성도</title>
  <desc id="desc">develop push 후 GitHub Actions가 WireGuard와 SSH로 NCP 앱 서버에 배포한다. 사용자는 HTTP로 호스트 Nginx에 접속하고, 요청은 Docker의 Spring Boot와 프라이빗 서브넷의 PostgreSQL로 전달된다. CLOVA Studio와 OCR, 프론트엔드와 HTTPS는 예정 항목이다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3b536d"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563a6"/></marker>
    <marker id="plan-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#a96c21"/></marker>
    <style>
      text{font-family:'Malgun Gothic','맑은 고딕',sans-serif;fill:#183348}
      .title{font-size:32px;font-weight:700}.h{font-size:23px;font-weight:700}.m{font-size:19px}.s{font-size:16px}.muted{fill:#50687c}
      .node{fill:#fff;stroke:#b6c6d3;stroke-width:1.7}.plan{fill:#fffaf0;stroke:#c09251;stroke-width:1.7;stroke-dasharray:7 5}
      .runtime{fill:none;stroke:#3b536d;stroke-width:2.2;marker-end:url(#arrow)}
      .deploy{fill:none;stroke:#2563a6;stroke-width:2.4;marker-end:url(#blue-arrow)}
      .future{fill:none;stroke:#a96c21;stroke-width:2;stroke-dasharray:7 5}
    </style>
  </defs>
  <rect width="1600" height="1070" fill="#fff"/>
  <text x="40" y="49" class="title">첫살림 개발 환경 및 시스템 구성도</text>
  <text x="40" y="77" class="s muted">구성 확인 기준 2026.10.28 · 현재 개발·실증 환경</text>

  <rect x="40" y="115" width="225" height="125" rx="13" class="node"/>
  <text x="152" y="154" text-anchor="middle" class="h">개발자</text>
  <text x="152" y="188" text-anchor="middle" class="m">Git · develop push</text>
  <text x="152" y="217" text-anchor="middle" class="s muted">기본 개발 브랜치</text>
  <path d="M265 178 H343" class="runtime"/>

  <rect x="350" y="115" width="270" height="125" rx="13" class="node"/>
  <text x="485" y="154" text-anchor="middle" class="h">GitHub</text>
  <text x="485" y="188" text-anchor="middle" class="m">cheotsalim-backend</text>
  <text x="485" y="217" text-anchor="middle" class="s muted">소스 및 워크플로 관리</text>
  <path d="M620 178 H693" class="deploy"/>

  <rect x="700" y="115" width="335" height="125" rx="13" fill="#f1f7ff" stroke="#8eb4d9" stroke-width="1.7"/>
