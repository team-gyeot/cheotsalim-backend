  <text x="1320" y="520" text-anchor="middle" class="m">Cloud DB for PostgreSQL</text>
  <text x="1320" y="556" text-anchor="middle" class="h">PostgreSQL 17.11</text>
  <text x="1320" y="590" text-anchor="middle" class="m">cheotsalim · :5432</text>
