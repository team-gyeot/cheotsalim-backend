  <text x="795" y="640" text-anchor="middle" class="s">Java 21 · API :8080</text>

  <rect x="1140" y="405" width="360" height="320" rx="10" fill="#f2f8f4" stroke="#bdd6c6" stroke-width="1.5"/>
