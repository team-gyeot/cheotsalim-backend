  <text x="1320" y="656" text-anchor="middle" class="s muted">관리형 DB · 앱 컨테이너와 분리</text>
  <path d="M920 606 H1158" class="runtime"/>
  <rect x="958" y="574" width="152" height="26" rx="5" fill="#fff"/>
  <text x="1034" y="593" text-anchor="middle" class="s">JPA / JDBC :5432</text>

  <rect x="40" y="548" width="230" height="130" rx="12" class="node"/>
  <text x="155" y="588" text-anchor="middle" class="h">Client</text>
  <text x="155" y="621" text-anchor="middle" class="m">브라우저 / API 도구</text>
  <text x="155" y="651" text-anchor="middle" class="s muted">외부 health 접속 확인 완료</text>
  <path d="M270 606 H453" class="runtime"/>
  <rect x="289" y="572" width="135" height="26" rx="5" fill="#fff"/>
  <text x="356" y="592" text-anchor="middle" class="s">HTTP :80</text>

  <rect x="40" y="810" width="230" height="145" rx="12" class="plan"/>
  <text x="155" y="848" text-anchor="middle" class="m">프론트엔드</text>
  <text x="155" y="881" text-anchor="middle" class="m">서비스 도메인 / HTTPS</text>
  <text x="155" y="921" text-anchor="middle" class="s muted">준비·구성 예정</text>

